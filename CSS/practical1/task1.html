<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color: rgb(20, 19, 19);
            color: white;
            font-family: calibri;
            text-align: center;
            padding: 25px;
        }
        body{
            background-color: rgb(209, 242, 255);
        }
        h2{
            text-align: center;
            font-family: calibri;
        }
        div{
            background-color: white;
            display: inline-block;
            padding: 20px 50px;
            border-radius: 8px;
            text-align: center;
            font-family: calibri;
            box-shadow: 1px 1px 10px gainsboro;
        }
        .profile{
            width: 150px;
            height: 150px;
        }
        div p{
            color: gray;
        }
        main{
            font-family: calibri;
            display: inline-block;
            padding: 30px;
            background-color: rgb(254, 254, 194);
            border-radius: 8px;
            font-weight: bold;
            margin: 30px;
        }
        #slide{
            background-color: skyblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size:18px;
        }
        #grow{
            background-color: rgb(222, 105, 222);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size:18px;
            box-shadow: 1px 1px 10px rgb(222, 105, 222);

        }
    </style>
</head>
<body>
    
    <header>
        <h1>Multi Effect UI Showcase</h1>
        <p>All sections styled without flexbox</p>
    </header>
    <h2>Layered Profile Cards</h2>
    <div>
        <img class="profile" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="">
        <h3>Alice</h3>
        <p >UI/UX Designer</p>
    </div>
    <div>
        <img class="profile" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="">
        <h3>Alice</h3>
        <p >UI/UX Designer</p>
    </div>
    <h2>Quiz flashCards</h2>
    <main>
        What is HTML ?
    </main>
    <main>
        What is CSS ?
    </main>
    <h2>Creative Buttons</h2>
    <button id="slide">Slide Button</button>
    <button id="grow">Grow Button</button>



</body>
</html>
