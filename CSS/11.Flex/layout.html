<!DOCTYPE html>

<head>

    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        section{
            background-color: rgb(28, 26, 26);
            color: white;
            font-family: cursive;
            font-size: 32px;
            padding: 50px;
        }
        h1{
            text-align: center;
        }
        div{
            padding: 25px;
            display: flex;
            gap: 25px;

            flex-wrap: wrap;
        }
        main{
            flex-grow: 1;
            flex-basis: 300px;
        }
        main:nth-child(1){
            background-color: darkblue;
        }
        main:nth-child(2){
            background-color: darkslategray;
        }
        main:nth-child(3){
            background-color: darkred;
        }
        main:nth-child(4){
            background-color: darkolivegreen;
        }
        img{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
