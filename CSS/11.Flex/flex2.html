<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(28, 28, 28);
        }
        section{
            margin: 50px;
            color: white;
            font-family: cursive;
            font-size: 24px;
            background-color: black;
            padding: 25px;
            height: 800px;
            display: flex;
            /* justify-content: center; */
            /* flex-direction: row-reverse;
           */
             flex-wrap: wrap; 
            /* flex-flow: row-reverse wrap; */
            gap: 20px;
            /* align-items: stretch; */
            /* align-items: start; */
            /* align-items: end; */
            /* align-items: center; */

            
            
        }
        div{
            /* height: 200px; */
            flex-grow: 1;
            flex-basis: 250px;
        }
        div:nth-child(1){
            background-color: red;
            order: 2;
            /* align-items: center; */
            /* align-content: center; */
            /* align-self: center; */
            /* text-align: center; */
        }
        div:nth-child(2){
            background-color: blue;
            /* flex-grow: 1.5; */
            order: 1;
        }
        div:nth-child(3){
            background-color: green;
            order: -1;
        }
        div:nth-child(4){
            background-color: darkmagenta;
            order: 0;
        }
    </style>
</head>
<body>
    <section>
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
    </section>
</body>
</html>
