<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: red;
        }
        div:hover{
            background-color: blue;
        }
        h1:hover{
            color: white;
            background-color: black;
            font-size: 56px;
        }
    </style>
</head>
<body>
    <div></div>
    <h1>HTML</h1>
</body>
</html>
