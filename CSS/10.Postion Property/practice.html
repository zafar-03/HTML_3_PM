<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(23, 22, 22);
        }
        div{
            width: 200px;
            position: absolute;
            transition: all 1.5s;
        }
        div:nth-child(1){
            left: 50px;
        }
        div:nth-child(2){
            left: 100px;
        }
        div:nth-child(3){
            left: 150px;
        }
        div:nth-child(4){
            left: 200px;
        }

        div:hover{
            z-index: 1;
            transform: rotate(360deg);
        }

        img{
            width: 100%;
            height: 200px;
        }
    </style>
</head>
<body>
    
    <div>
        <img src="https://images.unsplash.com/photo-1607024301817-3bbc081205cd?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aGQlMjBkZXNrdG9wJTIwd2FsbHBhcGVyfGVufDB8fDB8fHww" alt="">
    </div>
    <div>
        <img src="https://images.unsplash.com/photo-1542856391-010fb87dcfed?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8d2FsbHBhcGVycyUyMGhkfGVufDB8fDB8fHww" alt="">
    </div>
    <div>
        <img src="https://images.unsplash.com/photo-1477346611705-65d1883cee1e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8NGslMjB3YWxscGFwZXJzfGVufDB8fDB8fHww" alt="">
    </div>
    <div>
        <img src="https://images.unsplash.com/photo-1551309292-e185c0b6e22a?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdhbGxwYXBlciUyMGhkfGVufDB8fDB8fHww" alt="">
    </div>

</html>
