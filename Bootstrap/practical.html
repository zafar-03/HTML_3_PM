<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header class="container d-flex justify-content-between align-items-center p-3">
        <div class="fw-bolder fs-4 text-primary">
            Start Bootstrap
        </div>
        <div class="d-flex gap-4">
            <span class="text-black-50">Home</span>
            <span class="text-black-50">Resume</span>
            <span class="text-black-50">Projects</span>
            <span class="text-black-50">Contact</span>
        </div>
    </header>

    <main class="container">
        <section class=" row ">
            <div class=" col d-flex flex-column align-items-start gap-4 align-self-center pb-3">
                <p class="m-0 text-white text-uppercase bg-primary px-2 rounded">Design · Development · Marketing</p>
                <div>
                    <p class="m-0 text-black-50 fs-3">I can help your business to</p>
                    <h1 class="m-0 display-1 fw-bolder text-primary lh-1 pb-4">Get online and grow fast</h1>
                </div>
                <div class="d-flex gap-2">
                    <button class="py-2 px-4 rounded text-white bg-primary border-0">Resume</button>
                    <button class="py-2 px-4 rounded text-black bg-transparent">Projects</button>
                </div>
            </div>
            <div class="bg-primary rounded-4 col pt-4  d-flex justify-content-center">
                <img height="700px" src="https://startbootstrap.github.io/startbootstrap-personal/assets/profile.png"
                    alt="">
            </div>
        </section>
    </main>

    <!-- About -->
    <section class="container">
        <main class="my-4">
            <div class="text-center p-3 fs-1 fw-bolder text-primary">About</div>
            <div class="p-3">
                <section class="m-auto  w-50 d-flex justify-content-between p-2 text-black-50">
                    <span>HTML</span>
                    <span>85%</span>
                </section>
                <section class="m-auto w-50 p-2">
                    <div class="progress " role="progressbar" aria-label="Animated striped example" aria-valuenow="75"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 85%"></div>
                    </div>
                </section>


                <section class="m-auto  w-50 d-flex justify-content-between p-2 text-black-50">
                    <span>CSS</span>
                    <span>67%</span>
                </section>
                <section class="m-auto w-50 p-2">
                    <div class="progress " role="progressbar" aria-label="Animated striped example" aria-valuenow="75"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 67%">
                        </div>
                    </div>
                </section>

                <section class="m-auto  w-50 d-flex justify-content-between p-2 text-black-50">
                    <span>JS</span>
                    <span>96%</span>
                </section>
                <section class="m-auto w-50 p-2">
                    <div class="progress " role="progressbar" aria-label="Animated striped example" aria-valuenow="75"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                            style="width: 96%"></div>
                    </div>
                </section>

                <section class="m-auto  w-50 d-flex justify-content-between p-2 text-black-50">
                    <span>C#</span>
                    <span>20%</span>
                </section>
                <section class="m-auto w-50 p-2">
                    <div class="progress " role="progressbar" aria-label="Animated striped example" aria-valuenow="75"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger"
                            style="width: 20%"></div>
                    </div>
                </section>
            </div>
        </main>
    </section>

    <footer class="border-top p-3">
        <p class="text-center m-0"> Copyright by @zafar in 2026</p>

        <div class="pt-4 w-50 m-auto d-flex justify-content-around">
            <span class="material-symbols-outlined">
                mail
            </span>
            <span class="material-symbols-outlined">
                adaptive_audio_mic
            </span>
            <span class="material-symbols-outlined">
                drive_export
            </span>
            <span class="material-symbols-outlined">
                cast
            </span>

        </div>
    </footer>

</body>

</html>
